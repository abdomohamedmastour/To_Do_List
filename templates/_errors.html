{% macro show(errors) %}
<div class="js-errors">{% if errors %}
    <div class="alert alert-danger py-2 mt-2 mb-0" role="alert">
        <ul class="mb-0 ps-3">
            {% for error in errors %}
            <li>{{ error }}</li>
            {% endfor %}
        </ul>
    </div>
{% endif %}</div>
{% endmacro %}
