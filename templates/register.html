{% extends "base.html" %}
{% from "_errors.html" import show as show_errors %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="card card-auth">
  <div class="card-body p-4">
    <h1 class="h4 mb-3">Create your account</h1>
    <form method="post" action="{{ url_for('register') }}" data-validate="register" novalidate>
      {{ show_errors(errors) }}
      <div class="mb-3 mt-3">
        <label for="name" class="form-label">Name</label>
        <input type="text" class="form-control" id="name" name="name" value="{{ name }}" autocomplete="name">
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" name="email" value="{{ email }}" autocomplete="email">
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" name="password" autocomplete="new-password">
      </div>
      <div class="mb-3">
        <label for="confirm_password" class="form-label">Confirm password</label>
        <input type="password" class="form-control" id="confirm_password" name="confirm_password" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary w-100">Register</button>
    </form>
    <p class="text-center text-muted mt-3 mb-0">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
  </div>
</div>
{% endblock %}
